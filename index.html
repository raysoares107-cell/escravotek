<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fábrica - Escravotek</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111;color:#fff}
#topo{background:#000;padding:15px;display:flex;justify-content:space-between}
#fabrica{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.maquina{background:#222;border-radius:12px;padding:15px;text-align:center;border:2px solid #333}
.maquina.ligada{border-color:#e50914}
.barra{height:12px;background:#000;border-radius:10px;margin:10px 0;overflow:hidden}
.enchimento{height:100%;width:0%;background:#23a559}
.botao{padding:12px;background:#e50914;color:#fff;border:none;border-radius:6px;font-weight:bold;width:100%}
#produto{grid-column:1/3;background:#1a1a1a;border-radius:12px;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="topo"><b>🧵 FÁBRICA</b><span>R$ <b id="dinheiro">0</b></span><span>Feitos: <b id="total">0</b></span></div>

<div id="fabrica">
<div class="maquina" id="m1" onclick="trabalhar(1)"><h3>1 - TEAR</h3><p>Tecer</p><div class="barra"><div class="enchimento" id="b1"></div></div><button class="botao">TECER</button></div>
<div class="maquina" id="m2" onclick="trabalhar(2)"><h3>2 - CORTE</h3><p>Cortar</p><div class="barra"><div class="enchimento" id="b2"></div></div><button class="botao">CORTAR</button></div>
<div class="maquina" id="m3" onclick="trabalhar(3)"><h3>3 - COSTURA</h3><p>Costurar</p><div class="barra"><div class="enchimento" id="b3"></div></div><button class="botao">COSTURAR</button></div>
<div class="maquina" id="m4" onclick="trabalhar(4)"><h3>4 - PRENSA</h3><p>Finalizar</p><div class="barra"><div class="enchimento" id="b4"></div></div><button class="botao">FINALIZAR</button></div>
<div id="produto"><div style="font-size:50px">📦</div><h2 id="aviso">Comece no TEAR</h2><p id="passo">Etapa 0 de 4</p></div>
</div>

<script>
let passo=0,dinheiro=0,total=0;
function trabalhar(num){
 if(num!==passo+1){document.getElementById('aviso').innerText='Ordem errada! Vai para etapa '+(passo+1);return;}
 let p=0; let barra=document.getElementById('b'+num);
 let t=setInterval(()=>{p+=10; barra.style.width=p+'%'; if(p>=100){clearInterval(t); passo=num; if(passo==4){total++;dinheiro+=35;document.getElementById('total').innerText=total;document.getElementById('dinheiro').innerText=dinheiro;document.getElementById('aviso').innerText='PRONTO! +R$35';passo=0;document.querySelectorAll('.enchimento').forEach(e=>e.style.width='0%');}else{document.getElementById('aviso').innerText='Próximo: etapa '+(passo+1)} document.getElementById('passo').innerText='Etapa '+passo+' de 4';}},80);
}
</script>
</body>
</html>
